name: Build and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Debian build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential debhelper-compat devscripts
      - name: Run tests
        run: make test
      - name: Build package
        run: dpkg-buildpackage -us -uc -Zgzip
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ../wb-dali-ha_*.deb
